{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Submit Grievance - One Pension One ID</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'assets/bootstrap/css/bootstrap.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
{% include 'navbar.html' %}
<!-- Grievance Form -->
<section class="py-5 my-5">
    <div class="container py-5">
        <div class="row align-items-center">
            <div class="col-md-6 text-center mb-4 mb-md-0">
                <img class="img-fluid" src="{% static 'assets/img/illustrations/register.svg' %}" alt="Submit Grievance">
            </div>
            <div class="col-md-6 col-xl-5 offset-xl-1">
                <h2 class="display-6 fw-bold mb-4">Submit a Grievance</h2>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <select class="form-select" id="subject" name="subject" required>
                            <option value="">-- Select an Issue --</option>
                            <option value="Pension not credited">Pension not credited</option>
                            <option value="Incorrect pension amount">Incorrect pension amount</option>
                            <option value="KYC verification issue">KYC verification issue</option>
                            <option value="Life certificate submission failed">Life certificate submission failed</option>
                            <option value="Bank details mismatch">Bank details mismatch</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe your issue..." required></textarea>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Submit Grievance</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-light text-muted mt-5">
    <div class="container py-4">
        <div class="row">
            <div class="col-md-6">
                <p class="mb-0">© 2025 One Pension One ID</p>
            </div>
            <div class="col-md-6 text-md-end">
                <a href="#" class="me-3">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </div>
</footer>

<script src="{% static 'assets/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
